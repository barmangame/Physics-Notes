<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فیزیک دهم | فصل اول — فیزیک و اندازه‌گیری</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f8fb;
      --surface: #ffffff;
      --surface-2: #eef4fa;
      --surface-3: #e3edf7;
      --border: #d6e3ef;
      --text: #14232e;
      --text-muted: #4a6579;
      --heading: #0b2b4a;
      --accent: #0e7c6b;
      --accent-soft: #e1f4f0;
      --accent-border: #b3e0d6;
      --warn-bg: #fff6e6;
      --warn-border: #f0c78a;
      --warn-text: #8a5600;
      --note-bg: #eaf3ff;
      --note-border: #b9d4f7;
      --note-text: #1a4e8a;
      --example-bg: #eefaf2;
      --example-border: #b3e6c8;
      --example-text: #16603a;
      --danger: #c0392b;
      --success: #1e7e5a;
      --shadow: 0 10px 30px -12px rgba(11, 43, 74, 0.15);
      --radius: 1.25rem;
      --font: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --header-h: 64px;
    }

    [data-theme="dark"] {
      --bg: #0b151e;
      --surface: #111f2b;
      --surface-2: #17293a;
      --surface-3: #1e3548;
      --border: #254055;
      --text: #d4e4f2;
      --text-muted: #8aa7bd;
      --heading: #c3e0f5;
      --accent: #3ec9b0;
      --accent-soft: #123a35;
      --accent-border: #1e5c52;
      --warn-bg: #2a2115;
      --warn-border: #6b4d1e;
      --warn-text: #f0c47a;
      --note-bg: #142433;
      --note-border: #2a4a6b;
      --note-text: #9cc6f0;
      --example-bg: #11261b;
      --example-border: #2a5c3f;
      --example-text: #8fd6a8;
      --danger: #e06b5c;
      --success: #3ec9b0;
      --shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.6);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.9;
      direction: rtl;
      font-size: 16px;
      transition: background var(--transition), color var(--transition);
      min-height: 100vh;
      padding-bottom: 2rem;
      overflow-x: hidden;
    }
    a { color: var(--accent); text-decoration: none; transition: color var(--transition); }
    a:hover { color: var(--heading); }
    p { margin: 0.7rem 0; }
    ul, ol { padding-right: 1.6rem; margin: 0.6rem 0; }
    li { margin: 0.35rem 0; }
    strong { font-weight: 700; color: var(--heading); }
    ::selection { background: var(--accent); color: #fff; }
    img { max-width: 100%; height: auto; }

    h1, h2, h3, h4 { color: var(--heading); line-height: 1.5; }
    h1 { font-size: clamp(1.4rem, 4vw, 2.1rem); font-weight: 800; letter-spacing: -0.01em; }
    h2 { font-size: clamp(1.2rem, 3vw, 1.55rem); font-weight: 800; margin-bottom: 0.6rem; }
    h3 { font-size: clamp(1rem, 2.5vw, 1.12rem); font-weight: 700; color: var(--accent); margin: 1.6rem 0 0.5rem; }
    h4 { font-size: 1rem; font-weight: 700; margin: 1rem 0 0.3rem; }

    /* ============ FLECH BORDARI (جایگزین فلش ترکیبی) ============ */
    /* این روش در همه فونت‌ها و دستگاه‌ها کار می‌کند */
    .vec {
      position: relative;
      display: inline-block;
      direction: ltr;
      padding-top: 0.35em;
      font-style: italic;
      font-family: 'Times New Roman', 'Vazirmatn', serif;
    }
    .vec::after {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0.6em;
      height: 0.55em;
      background-color: currentColor;
      -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'><path d='M5 1 L9 9 L5 7 L1 9 Z' fill='black'/></svg>") no-repeat center / contain;
      mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'><path d='M5 1 L9 9 L5 7 L1 9 Z' fill='black'/></svg>") no-repeat center / contain;
      pointer-events: none;
    }

    /* ============ HEADER ============ */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: color-mix(in srgb, var(--surface) 90%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      transition: background var(--transition), border-color var(--transition);
    }
    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.7rem 1.2rem;
      min-height: var(--header-h);
    }
    .brand { display: flex; align-items: center; gap: 0.6rem; min-width: 0; }
    .brand-badge {
      width: 2.6rem; height: 2.6rem;
      display: grid; place-items: center;
      background: linear-gradient(135deg, var(--accent), #0a5b4f);
      color: #fff;
      font-weight: 800;
      border-radius: 0.9rem;
      font-size: 1.1rem;
      box-shadow: 0 4px 12px -4px var(--accent);
      flex-shrink: 0;
    }
    .brand-text { min-width: 0; }
    .brand-text small { display: block; font-size: 0.7rem; color: var(--text-muted); line-height: 1.3; }
    .brand-text strong { font-size: 0.95rem; color: var(--heading); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .header-actions { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
    .icon-btn {
      width: 2.5rem; height: 2.5rem;
      display: grid; place-items: center;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 0.8rem;
      color: var(--text);
      cursor: pointer;
      font-size: 1.1rem;
      transition: all var(--transition);
    }
    .icon-btn:hover { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent); }
    .menu-toggle { display: none; }

    /* ============ LAYOUT ============ */
    .page-wrap {
      max-width: 1280px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 1.6rem;
      padding: 1.5rem 1.2rem;
      align-items: start;
    }

    /* ============ SIDEBAR ============ */
    .sidebar {
      position: sticky;
      top: calc(var(--header-h) + 1rem);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 0.85rem;
      box-shadow: var(--shadow);
      max-height: calc(100vh - var(--header-h) - 2rem);
      overflow-y: auto;
      transition: background var(--transition), border-color var(--transition), transform var(--transition);
    }
    .sidebar-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0 0.6rem 0.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0.5rem;
    }
    .nav-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.15rem; }
    .nav-link {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.55rem 0.7rem;
      border-radius: 0.7rem;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 500;
      transition: all var(--transition);
      border: 1px solid transparent;
      cursor: pointer;
      user-select: none;
    }
    .nav-link .nav-icon {
      width: 1.6rem; height: 1.6rem;
      display: grid; place-items: center;
      background: var(--surface-2);
      border-radius: 0.5rem;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
      transition: all var(--transition);
    }
    .nav-link:hover { background: var(--surface-2); color: var(--heading); }
    .nav-link.active {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--accent);
      font-weight: 700;
    }
    .nav-link.active .nav-icon { background: var(--accent); color: #fff; }
    .nav-divider { height: 1px; background: var(--border); margin: 0.5rem 0.4rem; }

    /* ============ MAIN ============ */
    .main-content { min-width: 0; }

    .hero {
      background: linear-gradient(135deg, var(--surface), var(--surface-2));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: clamp(1.2rem, 4vw, 2.2rem);
      margin-bottom: 1.6rem;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      scroll-margin-top: calc(var(--header-h) + 1rem);
    }
    .hero::before {
      content: '';
      position: absolute;
      top: -60px; left: -60px;
      width: 220px; height: 220px;
      background: radial-gradient(circle, var(--accent-soft), transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
      font-size: 0.78rem;
      padding: 0.25rem 0.9rem;
      border-radius: 2rem;
      border: 1px solid var(--accent-border);
      margin-bottom: 0.9rem;
    }
    .hero h1 { margin-bottom: 0.5rem; }
    .hero p { color: var(--text-muted); max-width: 65ch; margin-bottom: 1.2rem; }
    .hero-stats {
      display: flex; flex-wrap: wrap; gap: 0.6rem;
      position: relative; z-index: 1;
    }
    .stat-chip {
      display: flex; align-items: center; gap: 0.4rem;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.3rem 0.85rem;
      border-radius: 2rem;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text);
    }
    .stat-chip span:first-child { font-size: 1rem; }

    /* ============ SECTIONS ============ */
    .content-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: clamp(1.2rem, 3vw, 1.8rem);
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow);
      transition: background var(--transition), border-color var(--transition);
      scroll-margin-top: calc(var(--header-h) + 1rem);
    }
    .section-head {
      display: flex; align-items: center; gap: 0.8rem;
      margin-bottom: 0.9rem;
      padding-bottom: 0.6rem;
      border-bottom: 2px solid var(--border);
      flex-wrap: wrap;
    }
    .section-num {
      width: 2.4rem; height: 2.4rem;
      display: grid; place-items: center;
      background: var(--accent);
      color: #fff;
      font-weight: 800;
      border-radius: 0.8rem;
      font-size: 1.05rem;
      flex-shrink: 0;
    }
    .section-head h2 { margin: 0; flex: 1; min-width: 0; }
    .section-head small { display: block; font-size: 0.8rem; color: var(--text-muted); font-weight: 400; }

    /* ============ INFO CARDS ============ */
    .info-card {
      border-radius: 1rem;
      padding: 1rem 1.25rem;
      margin: 1.1rem 0;
      border: 1px solid;
      border-right: 4px solid;
      transition: all var(--transition);
    }
    .info-card .ic-title {
      display: flex; align-items: center; gap: 0.45rem;
      font-weight: 800; font-size: 0.95rem; margin-bottom: 0.35rem;
    }
    .info-card p:last-child { margin-bottom: 0; }
    .card-note { background: var(--note-bg); border-color: var(--note-border); border-right-color: #3b82f6; }
    .card-note .ic-title { color: var(--note-text); }
    .card-warn { background: var(--warn-bg); border-color: var(--warn-border); border-right-color: #d97706; }
    .card-warn .ic-title { color: var(--warn-text); }
    .card-example { background: var(--example-bg); border-color: var(--example-border); border-right-color: var(--accent); }
    .card-example .ic-title { color: var(--example-text); }

    /* ============ TABLES ============ */
    .table-scroll {
      overflow-x: auto;
      border-radius: 0.9rem;
      border: 1px solid var(--border);
      margin: 1rem 0;
      -webkit-overflow-scrolling: touch;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      min-width: 380px;
    }
    thead th {
      background: var(--surface-2);
      color: var(--heading);
      font-weight: 700;
      padding: 0.7rem 0.55rem;
      border-bottom: 2px solid var(--border);
      text-align: center;
    }
    tbody td {
      padding: 0.55rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--surface-2); }
    .table-caption {
      background: var(--surface-2);
      padding: 0.4rem 0.9rem;
      font-size: 0.78rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
    }

    /* ============ FORMULA ============ */
    .formula {
      background: var(--surface-2);
      border: 1px dashed var(--accent-border);
      border-radius: 0.9rem;
      padding: 0.85rem 1.2rem;
      margin: 1rem 0;
      text-align: center;
      direction: ltr;
      font-family: 'Courier New', monospace;
      font-size: clamp(0.95rem, 2.5vw, 1.15rem);
      letter-spacing: 0.5px;
      color: var(--heading);
      overflow-x: auto;
    }
    /* .fx : نمایش صحیح یکا و عدد در متن RTL */
    .fx {
      display: inline-block;
      direction: ltr;
      unicode-bidi: isolate;
      font-family: 'Courier New', 'Vazirmatn', monospace;
      background: var(--surface-3);
      padding: 0.05rem 0.45rem;
      border-radius: 0.4rem;
      font-size: 0.95em;
      color: var(--heading);
      white-space: nowrap;
    }

    /* ============ QUIZ ============ */
    .quiz-toolbar {
      display: flex; flex-wrap: wrap; gap: 1rem;
      align-items: center; justify-content: space-between;
      margin-bottom: 1.2rem;
    }
    .score-pill {
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: var(--accent);
      font-weight: 700;
      padding: 0.35rem 1.1rem;
      border-radius: 2rem;
      font-size: 0.88rem;
    }
    .btn-reset {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.85rem;
      padding: 0.45rem 1.2rem;
      border-radius: 2rem;
      cursor: pointer;
      transition: all var(--transition);
    }
    .btn-reset:hover { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent); }

    .quiz-item {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.1rem 1.2rem;
      margin-bottom: 1rem;
      transition: all var(--transition);
    }
    .quiz-q { display: flex; gap: 0.7rem; margin-bottom: 0.8rem; }
    .q-index {
      width: 1.9rem; height: 1.9rem;
      display: grid; place-items: center;
      background: var(--accent);
      color: #fff;
      border-radius: 0.6rem;
      font-weight: 800;
      font-size: 0.8rem;
      flex-shrink: 0;
    }
    .q-body { flex: 1; min-width: 0; }
    .q-topic { font-size: 0.72rem; color: var(--text-muted); font-weight: 500; }
    .q-text { font-weight: 600; font-size: 0.97rem; }

    .options { display: flex; flex-direction: column; gap: 0.4rem; }
    .opt {
      display: flex; align-items: center; gap: 0.65rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2rem;
      padding: 0.5rem 0.95rem;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all var(--transition);
      user-select: none;
    }
    .opt:hover { background: var(--surface-3); border-color: var(--accent-border); }
    .opt .onum {
      width: 1.5rem; height: 1.5rem;
      display: grid; place-items: center;
      background: var(--surface-3);
      color: var(--text);
      border-radius: 50%;
      font-size: 0.75rem;
      font-weight: 700;
      flex-shrink: 0;
      transition: all var(--transition);
    }
    .opt.is-correct { background: var(--example-bg); border-color: var(--example-border); font-weight: 600; }
    .opt.is-correct .onum { background: var(--success); color: #fff; }
    .opt.is-wrong { background: #fdecea; border-color: #e6a29a; }
    [data-theme="dark"] .opt.is-wrong { background: #3a1d1a; border-color: #8a3a32; }
    .opt.is-wrong .onum { background: var(--danger); color: #fff; }

    .btn-answer {
      margin-top: 0.6rem;
      background: var(--surface-3);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.8rem;
      padding: 0.3rem 1rem;
      border-radius: 2rem;
      cursor: pointer;
      transition: all var(--transition);
    }
    .btn-answer:hover { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent); }
    .answer-panel {
      display: none;
      margin-top: 0.8rem;
      background: var(--note-bg);
      border: 1px solid var(--note-border);
      border-right: 3px solid #3b82f6;
      border-radius: 0.8rem;
      padding: 0.8rem 1rem;
      font-size: 0.88rem;
    }
    .answer-panel.show { display: block; }
    .answer-panel .correct-tag {
      display: inline-block;
      background: var(--success);
      color: #fff;
      font-weight: 800;
      padding: 0.05rem 0.7rem;
      border-radius: 2rem;
      font-size: 0.75rem;
      margin-left: 0.4rem;
    }

    /* ============ FOOTER ============ */
    .site-footer {
      max-width: 1280px;
      margin: 2rem auto 0;
      padding: 1.5rem 1.2rem;
      text-align: center;
      border-top: 1px solid var(--border);
    }
    .footer-brand {
      display: inline-flex; align-items: center; gap: 0.5rem;
      font-weight: 800;
      color: var(--heading);
      margin-bottom: 0.3rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .footer-brand span {
      background: linear-gradient(135deg, var(--accent), #0a5b4f);
      color: #fff;
      padding: 0.15rem 0.6rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
    }
    .footer-line { color: var(--text-muted); font-size: 0.82rem; }
    .footer-line a { font-weight: 600; }

    /* ============ BACK TO TOP ============ */
    .to-top {
      position: fixed;
      bottom: 1.5rem; left: 1.5rem;
      width: 2.8rem; height: 2.8rem;
      display: grid; place-items: center;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 1rem;
      cursor: pointer;
      font-size: 1.1rem;
      box-shadow: 0 6px 18px -4px var(--accent);
      opacity: 0; pointer-events: none;
      transition: opacity var(--transition), transform var(--transition);
      z-index: 90;
    }
    .to-top.visible { opacity: 1; pointer-events: auto; }
    .to-top:hover { transform: translateY(-3px); }

    /* ============ OVERLAY ============ */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 150;
      opacity: 0; pointer-events: none;
      transition: opacity var(--transition);
    }
    .overlay.show { opacity: 1; pointer-events: auto; }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 980px) {
      :root { --header-h: 60px; }
      .page-wrap { grid-template-columns: 1fr; padding: 1rem 0.9rem; gap: 1rem; }
      .sidebar {
        position: fixed;
        top: 0; right: 0;
        width: min(300px, 85vw);
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
        z-index: 200;
        transform: translateX(105%);
        transition: transform var(--transition);
        padding-top: 1.2rem;
        box-shadow: -10px 0 40px rgba(0,0,0,0.25);
      }
      .sidebar.open { transform: translateX(0); }
      .menu-toggle
